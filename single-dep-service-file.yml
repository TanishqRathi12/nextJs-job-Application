apiVersion: apps/v1
kind: Deployment
metadata:
  name: career-dock
spec:
  replicas: 2
  # revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: career-dock-node # it finds the pod with this label and forwards the request to that pod
  template:
    metadata:
      labels:
        app: career-dock-node # if you change this label, you also need to change the selector in the Service definition to match this new label.
    spec:
      containers:
        - name: career-container
          image: tanishqrathi/test-1:05-01-01
          ports:
            - containerPort: 3000 # This is the port on which the container is listening. It should match the targetPort defined in the Service.
              # if want to make multiple containers in a single pod, you can add more container definitions here like you describe above.
          # env:
          #   - name: DATABASE_URL
          #     valueFrom:
          #       secretKeyRef:
          #         name: app-secret
          #         key: DATABASE_URL

          #   - name: JWT_SECRET
          #     valueFrom:
          #       secretKeyRef:
          #         name: app-secret
          #         key: JWT_SECRET

---
apiVersion: v1
kind: Service
metadata:
  name: career-dock-service
spec:
  ports:
    - name: http
      port: 3000 # This is the port on which the service will be exposed. You can choose any available port number.
      targetPort: 3000 # This is the port on which the container is listening. It should match the containerPort defined in the Deployment.
  selector:
    app: career-dock-node # it finds the pod with this label and forwards the request to that pod
  type: LoadBalancer
